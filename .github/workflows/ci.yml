name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            build:
              - ndt_cuda/**
              - ndt_cuda_autoware_backend/**
              - .github/workflows/ci.yml

  autoware-index:
    name: Autoware Index
    needs: changes
    if: needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [humble, jazzy]
    uses: autowarefoundation/autoware-index-github-actions/.github/workflows/validate-package.yaml@main
    with:
      ros_distro: ${{ matrix.ros_distro }}
      package_name: ndt_cuda
      pull-ccache: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
      push-ccache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      cache-key-element: build
      concurrency-group: autoware-index-validate-${{ matrix.ros_distro }}-${{ github.event_name == 'push' && 'main' || github.ref }}

  tests-without-cuda:
    name: Tests without CUDA toolkit
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake g++ libpcl-dev libeigen3-dev
      - name: Build and test
        run: |
          cmake -S ndt_cuda -B build -DNDT_CUDA_ENABLE_CUDA=OFF -DNDT_CUDA_BUILD_TESTS=ON
          cmake --build build -j4
          cd build && ctest --output-on-failure

  ci-result:
    name: CI result
    if: always()
    needs: [changes, autoware-index, tests-without-cuda]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
